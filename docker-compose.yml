version: "3.8"

services:
  apache_php:
    image: php:8.2-apache
    container_name: apache_php
    ports:
      - "8081:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crud_db
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
